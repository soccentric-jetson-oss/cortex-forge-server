syntax = "proto3";

package cortexforge;

option cc_generic_services = false;

// ══════════════════════════════════════════════════════════════════════════
// Cortex Forge gRPC Service — Ultra Feature-Rich API
// ══════════════════════════════════════════════════════════════════════════
//
// Exposes model lifecycle, multi-accelerator inference, streaming,
// telemetry, power/thermal monitoring, and fault recovery for the
// NVIDIA Jetson AGX Orin platform.

service CortexForge {
    // ── Model Lifecycle Management ─────────────────────────────────────────
    rpc LoadModel(LoadModelRequest) returns (LoadModelResponse);
    rpc UnloadModel(UnloadModelRequest) returns (UnloadModelResponse);
    rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
    rpc GetModelInfo(GetModelInfoRequest) returns (GetModelInfoResponse);
    rpc HotSwapModel(HotSwapModelRequest) returns (HotSwapModelResponse);

    // ── Inference ──────────────────────────────────────────────────────────
    rpc Infer(InferRequest) returns (InferResponse);
    rpc InferStream(InferRequest) returns (stream InferResponse);
    rpc BatchInfer(BatchInferRequest) returns (BatchInferResponse);

    // ── Accelerator Management ─────────────────────────────────────────────
    rpc GetAcceleratorStatus(GetAcceleratorStatusRequest) returns (GetAcceleratorStatusResponse);
    rpc AssignAccelerator(AssignAcceleratorRequest) returns (AssignAcceleratorResponse);

    // ── Monitoring & Telemetry ────────────────────────────────────────────
    rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
    rpc WatchMetrics(GetMetricsRequest) returns (stream MetricsSnapshot);
    rpc GetPowerTelemetry(GetPowerTelemetryRequest) returns (GetPowerTelemetryResponse);
    rpc GetThermalTelemetry(GetThermalTelemetryRequest) returns (GetThermalTelemetryResponse);

    // ── Fault Detection & Recovery ─────────────────────────────────────────
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
    rpc GetFaultLog(GetFaultLogRequest) returns (GetFaultLogResponse);
    rpc ResetAccelerator(ResetAcceleratorRequest) returns (ResetAcceleratorResponse);

    // ── System ────────────────────────────────────────────────────────────
    rpc GetSystemInfo(GetSystemInfoRequest) returns (GetSystemInfoResponse);
    rpc ShutdownServer(ShutdownServerRequest) returns (ShutdownServerResponse);
}

// ══════════════════════════════════════════════════════════════════════════
// Model Lifecycle Management
// ══════════════════════════════════════════════════════════════════════════

message LoadModelRequest {
    string model_path = 1;          // Path to model file
    string model_name = 2;          // Friendly name (auto-generated if empty)
    string framework = 3;           // "tensorrt", "onnx", "custom", "tflite"
    uint32 batch_size = 4;          // Max batch size (0 = default)
    string accelerator = 5;         // "gpu", "dla0", "dla1", "pva", "auto"
    map<string, string> options = 6; // Framework-specific options
    string model_type = 7;          // "detection", "classification", "segmentation", "audio", "timeseries", "ocr"
    repeated uint32 input_shape = 8; // Expected input shape [C, H, W] or [C, T]
    string input_dtype = 9;         // "float32", "uint8", "int8"
    uint32 input_channels = 10;     // Number of input channels
    uint32 input_width = 11;        // Input width in pixels
    uint32 input_height = 12;       // Input height in pixels
    uint32 input_fps = 13;          // Expected input frame rate
}

message LoadModelResponse {
    string model_id = 1;
    string model_name = 2;
    bool success = 3;
    string error_message = 4;
    uint64 load_time_us = 5;
    string assigned_accelerator = 6;
    ModelMetadata metadata = 7;
}

message UnloadModelRequest {
    string model_id = 1;
    bool force = 2;                 // Force unload even if in use
}

message UnloadModelResponse {
    bool success = 1;
    string error_message = 2;
    uint64 total_inferences = 3;    // Total inferences before unload
}

message ListModelsRequest {
    string filter = 1;              // Optional filter by name/type
    bool include_unloaded = 2;     // Include previously loaded models
}

message ModelMetadata {
    string model_id = 1;
    string model_name = 2;
    string framework = 3;
    uint32 batch_size = 4;
    string accelerator = 5;
    uint64 load_time_us = 6;
    uint64 total_inferences = 7;
    double avg_latency_us = 8;
    double p50_latency_us = 9;
    double p95_latency_us = 10;
    double p99_latency_us = 11;
    uint64 min_latency_us = 12;
    uint64 max_latency_us = 13;
    bool loaded = 14;
    string model_type = 15;
    repeated uint32 input_shape = 16;
    string input_dtype = 17;
    uint32 input_channels = 18;
    uint32 input_width = 19;
    uint32 input_height = 20;
    uint32 input_fps = 21;
    uint64 memory_usage_bytes = 22;
    double throughput_fps = 23;
    uint64 load_timestamp_us = 24;
    uint64 last_inference_timestamp_us = 25;
    string status = 26;             // "active", "error", "loading", "unloading"
    string error_state = 27;        // Error description if in error state
    uint64 error_count = 28;        // Number of inference errors
    double accuracy_metric = 29;    // Running accuracy metric if available
}

message ListModelsResponse {
    repeated ModelMetadata models = 1;
    uint32 total_count = 2;
    uint32 loaded_count = 3;
}

message GetModelInfoRequest {
    string model_id = 1;
    bool include_detailed_metrics = 2;
}

message GetModelInfoResponse {
    ModelMetadata model = 1;
    bool found = 2;
}

message HotSwapModelRequest {
    string model_id = 1;            // Model to replace
    string new_model_path = 2;      // New model file
    bool keep_state = 3;            // Preserve inference state if possible
}

message HotSwapModelResponse {
    bool success = 1;
    string error_message = 2;
    uint64 swap_time_us = 3;
    string new_model_id = 4;
}

// ══════════════════════════════════════════════════════════════════════════
// Inference
// ══════════════════════════════════════════════════════════════════════════

message InferRequest {
    string model_id = 1;
    bytes input_data = 2;           // Serialized input tensor(s)
    map<string, string> params = 3; // Inference parameters
    uint32 batch_index = 4;         // For batched inference
    bool collect_timings = 5;       // Collect detailed timing breakdown
}

message InferResponse {
    string model_id = 1;
    bytes output_data = 2;
    uint64 latency_us = 3;
    bool success = 4;
    string error_message = 5;
    uint64 preprocess_us = 6;       // Preprocessing time
    uint64 inference_us = 7;        // Core inference time
    uint64 postprocess_us = 8;     // Postprocessing time
    double confidence = 9;          // Overall confidence score
    string accelerator_used = 10;  // Which accelerator ran this
    uint64 sequence_number = 11;   // Monotonic sequence number
    map<string, double> extra_metrics = 12; // Model-specific metrics
}

message BatchInferRequest {
    string model_id = 1;
    repeated bytes inputs = 2;      // Multiple inputs for batch
    map<string, string> params = 3;
}

message BatchInferResponse {
    string model_id = 1;
    repeated bytes outputs = 2;
    repeated uint64 latencies_us = 3;
    bool success = 4;
    string error_message = 5;
    uint64 total_batch_time_us = 6;
}

// ══════════════════════════════════════════════════════════════════════════
// Accelerator Management
// ══════════════════════════════════════════════════════════════════════════

message AcceleratorStatus {
    string name = 1;                // "GPU", "DLA0", "DLA1", "PVA"
    string type = 2;                // "gpu", "dla", "pva"
    double utilization_percent = 3;
    uint64 frequency_hz = 4;
    int32 temperature_celsius = 5;
    uint64 memory_total_bytes = 6;
    uint64 memory_used_bytes = 7;
    uint32 power_state = 8;         // 0=off, 1=low, 2=active, 3=max
    double power_watts = 9;
    string status = 10;             // "online", "offline", "error", "throttled"
    uint64 total_tasks = 11;
    uint64 active_tasks = 12;
    uint64 queued_tasks = 13;
    uint64 failed_tasks = 14;
    double avg_task_latency_us = 15;
    uint64 uptime_ms = 16;
    string firmware_version = 17;
    string driver_version = 18;
    repeated string loaded_models = 19; // Models currently on this accelerator
}

message GetAcceleratorStatusRequest {
    // Empty returns all accelerators
    string accelerator_name = 1;    // Optional: specific accelerator
}

message GetAcceleratorStatusResponse {
    repeated AcceleratorStatus accelerators = 1;
}

message AssignAcceleratorRequest {
    string model_id = 1;
    string accelerator = 2;         // "gpu", "dla0", "dla1", "pva", "auto"
    bool force = 3;                 // Force migration if model is running
}

message AssignAcceleratorResponse {
    bool success = 1;
    string error_message = 2;
    string assigned_accelerator = 3;
    uint64 migration_time_us = 4;
}

// ══════════════════════════════════════════════════════════════════════════
// Monitoring & Telemetry
// ══════════════════════════════════════════════════════════════════════════

message GetMetricsRequest {
    uint32 history_seconds = 1;     // Include history for this many seconds
}

message MetricsSnapshot {
    // Accelerator metrics
    double gpu_util_percent = 1;
    double dla0_util_percent = 2;
    double dla1_util_percent = 3;
    double pva_util_percent = 4;

    // Memory
    uint64 gpu_mem_total_mb = 5;
    uint64 gpu_mem_used_mb = 6;
    uint64 dla_mem_total_mb = 7;
    uint64 dla_mem_used_mb = 8;
    uint64 system_mem_total_mb = 9;
    uint64 system_mem_used_mb = 10;

    // Inference statistics
    uint64 total_inferences = 11;
    double avg_latency_us = 12;
    double p50_latency_us = 13;
    double p95_latency_us = 14;
    double p99_latency_us = 15;
    uint64 min_latency_us = 16;
    uint64 max_latency_us = 17;
    uint64 inferences_per_second = 18;

    // Power & Thermal
    double gpu_power_watts = 19;
    double soc_power_watts = 20;
    double total_power_watts = 21;
    int32 gpu_temperature_celsius = 22;
    int32 cpu_temperature_celsius = 23;
    int32 board_temperature_celsius = 24;
    int32 thermal_throttle_percent = 25;

    // Per-model breakdown
    map<string, ModelMetrics> per_model_metrics = 26;

    // Timestamp
    uint64 timestamp_us = 27;
}

message ModelMetrics {
    uint64 total_inferences = 1;
    double avg_latency_us = 2;
    double p50_latency_us = 3;
    double p95_latency_us = 4;
    double p99_latency_us = 5;
    uint64 inferences_per_second = 6;
    uint64 errors = 7;
    double accuracy = 8;
    string accelerator = 9;
    uint64 memory_usage_bytes = 10;
}

message GetMetricsResponse {
    MetricsSnapshot current = 1;
    repeated MetricsSnapshot history = 2; // Historical data if requested
}

message GetPowerTelemetryRequest {
    uint32 history_seconds = 1;
}

message PowerRail {
    string name = 1;                // "GPU", "CPU", "DLA", "PVA", "SOC", "DDR"
    double voltage_v = 2;
    double current_a = 3;
    double power_watts = 4;
    double min_power_watts = 5;
    double max_power_watts = 6;
}

message GetPowerTelemetryResponse {
    repeated PowerRail rails = 1;
    double total_power_watts = 2;
    double power_budget_watts = 3;
    double power_cap_watts = 4;
    uint32 power_mode = 5;          // 0-15 MAXN modes
    uint64 timestamp_us = 6;
}

message GetThermalTelemetryRequest {
    uint32 history_seconds = 1;
}

message ThermalZone {
    string name = 1;                // "GPU", "CPU", "Board", "DLA0", "DLA1"
    int32 temperature_celsius = 2;
    int32 critical_temperature = 3;
    int32 throttle_temperature = 4;
    bool throttling = 5;
    uint32 throttle_percent = 6;
}

message GetThermalTelemetryResponse {
    repeated ThermalZone zones = 1;
    int32 max_temperature_celsius = 2;
    bool any_throttling = 3;
    uint64 timestamp_us = 4;
}

// ══════════════════════════════════════════════════════════════════════════
// Fault Detection & Recovery
// ══════════════════════════════════════════════════════════════════════════

message HealthCheckRequest {
    string service = 1;
    bool detailed = 2;              // Return detailed health info
}

message HealthCheckResponse {
    enum ServingStatus {
        UNKNOWN = 0;
        SERVING = 1;
        NOT_SERVING = 2;
        DEGRADED = 3;
    }
    ServingStatus status = 1;
    string version = 2;
    uint64 uptime_us = 3;
    uint32 active_models = 4;
    uint32 total_models = 5;
    uint64 total_inferences = 6;
    uint64 total_errors = 7;
    double memory_usage_percent = 8;
    repeated string warnings = 9;
    map<string, string> component_status = 10;
}

message FaultEvent {
    uint64 timestamp_us = 1;
    string component = 2;           // "gpu", "dla0", "dla1", "pva", "server"
    string fault_type = 3;          // "hang", "crash", "oom", "timeout", "thermal"
    string description = 4;
    string severity = 5;            // "info", "warning", "critical"
    bool recovered = 6;
    uint64 recovery_time_us = 7;
    string affected_model = 8;
}

message GetFaultLogRequest {
    uint32 max_events = 1;         // Max events to return (0 = all)
    string severity_filter = 2;    // "info", "warning", "critical"
    bool include_recovered = 3;
}

message GetFaultLogResponse {
    repeated FaultEvent events = 1;
    uint32 total_count = 2;
    uint32 unrecovered_count = 3;
}

message ResetAcceleratorRequest {
    string accelerator_name = 1;    // Which accelerator to reset
    bool force = 2;                 // Force reset even with active models
}

message ResetAcceleratorResponse {
    bool success = 1;
    string error_message = 2;
    uint64 reset_time_us = 3;
    repeated string affected_models = 4;
}

// ══════════════════════════════════════════════════════════════════════════
// System
// ══════════════════════════════════════════════════════════════════════════

message GetSystemInfoRequest {
    bool detailed = 1;
}

message SystemInfo {
    string platform = 1;            // "Jetson AGX Orin", "Jetson Xavier", etc.
    string serial_number = 2;
    string l4t_version = 3;         // Linux for Tegra version
    string kernel_version = 4;
    string jetpack_version = 5;
    uint64 total_ram_bytes = 6;
    uint64 free_ram_bytes = 7;
    uint32 cpu_count = 8;
    double cpu_util_percent = 9;
    uint64 disk_total_bytes = 10;
    uint64 disk_free_bytes = 11;
    uint64 uptime_seconds = 12;
    repeated string available_accelerators = 13;
    string server_version = 14;
    uint32 power_mode = 15;
    repeated string capabilities = 16; // "tensorrt", "cuda", "dla", "pva"
}

message GetSystemInfoResponse {
    SystemInfo info = 1;
}

message ShutdownServerRequest {
    bool force = 1;                 // Force shutdown without draining
    uint32 delay_seconds = 2;       // Delay before shutdown
    string reason = 3;
}

message ShutdownServerResponse {
    bool success = 1;
    string message = 2;
}
