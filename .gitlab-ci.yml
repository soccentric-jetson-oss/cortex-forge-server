# GitLab CI/CD for cortex-forge-server — AI inference orchestration gRPC daemon
# C++17 CMake project with Protobuf/gRPC, Catch2 tests, Doxygen docs.

stages:
  - build
  - test
  - lint
  - doc

variables:
  GIT_SUBMODULE_STRATEGY: none

build:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq cmake ninja-build g++-11 protobuf-compiler libprotobuf-dev libgrpc++-dev libgrpc-dev protobuf-compiler-grpc
  script:
    - mkdir -p build && cd build
    - cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
    - ninja
  artifacts:
    paths:
      - build/
    expire_in: 1 day

test:
  stage: test
  image: ubuntu:22.04
  needs: [build]
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq cmake ninja-build g++-11 protobuf-compiler libprotobuf-dev libgrpc++-dev libgrpc-dev protobuf-compiler-grpc
  script:
    - cd build
    - cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
    - ninja
    - ctest --output-on-failure -j$(nproc)

lint:
  stage: lint
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq clang-format-14 cppcheck
  script:
    - clang-format-14 --dry-run --Werror src/*.cpp src/**/*.cpp include/*.h 2>/dev/null || true
    - cppcheck --enable=all --inconclusive --suppress=missingIncludeSystem src/ 2>/dev/null || true

doc:
  stage: doc
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq doxygen graphviz
  script:
    - doxygen docs/Doxyfile 2>/dev/null || echo "Doxygen not configured"
  artifacts:
    paths:
      - docs/html/
    expire_in: 1 week
